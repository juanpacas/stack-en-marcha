<title>Stack en Marcha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E3E8EF; --ink:#14202B; --muted:#586677; --line:#D3DAE3;
  --accent:#2B59E0; --accent-ink:#FFFFFF; --accent-soft:#DCE5FC;
  --xp:#C77C0A; --xp-soft:#FBEBD0; --good:#1B7F51; --good-soft:#D8F1E4; --bad:#BF3328; --bad-soft:#F8DEDB;
  --code-bg:#0F1A26; --code-ink:#D8E2EE; --code-kw:#8AB4FF; --code-str:#F2C46B; --code-com:#7F8FA1;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C131C; --surface:#141E2A; --surface-2:#1C2836; --ink:#E7EDF4; --muted:#95A4B5; --line:#26364A;
    --accent:#86A2FF; --accent-ink:#0C131C; --accent-soft:#1D2A4A;
    --xp:#F2B04A; --xp-soft:#3A2A10; --good:#4CC38A; --good-soft:#12301F; --bad:#F0776C; --bad-soft:#3A1A17;
    --code-bg:#080E15;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C131C; --surface:#141E2A; --surface-2:#1C2836; --ink:#E7EDF4; --muted:#95A4B5; --line:#26364A;
  --accent:#86A2FF; --accent-ink:#0C131C; --accent-soft:#1D2A4A;
  --xp:#F2B04A; --xp-soft:#3A2A10; --good:#4CC38A; --good-soft:#12301F; --bad:#F0776C; --bad-soft:#3A1A17;
  --code-bg:#080E15;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:4px 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:8px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--mono);font-size:.8rem;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.9rem;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip svg{width:15px;height:15px}
.chip.xp{color:var(--xp)}
.chip.fire{color:var(--bad)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);font-weight:700}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.back svg{width:18px;height:18px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.xp>i{background:var(--xp)}

/* home hero */
.hero{display:grid;gap:12px;padding-top:14px}
.hero h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.level{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end}
.level b{font-family:var(--display);font-size:1.25rem}
.level small{color:var(--muted);font-variant-numeric:tabular-nums}
.level .bar{grid-column:1/-1}
.goal{display:flex;align-items:center;gap:12px}
.goal-ring{width:46px;height:46px;flex:none}
.continue{display:grid;gap:4px;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:16px 18px}
.continue span{opacity:.85;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.continue strong{font-family:var(--display);font-size:1.25rem}

/* trail */
.trail{position:relative;display:flex;flex-direction:column}
.trail::before{content:"";position:absolute;left:21px;top:26px;bottom:26px;width:3px;background:var(--line);border-radius:2px}
.trail-head{position:relative;z-index:1;background:var(--bg);padding:22px 0 10px;display:grid;gap:4px}
.trail-head h2{font-size:1.3rem}
.station{position:relative;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 0}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-family:var(--mono);font-weight:600;font-size:.95rem;z-index:1}
.station.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.station.now .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.st-t{display:block;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.2}
.st-d{display:block;font-size:.88rem;color:var(--muted)}
.station .count{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--xp-soft);color:var(--xp);margin-left:6px;vertical-align:2px}

/* module */
.lesson-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:16px;height:16px}
.lesson-row.done .check{background:var(--good);border-color:var(--good);color:#fff}
.lesson-row small{color:var(--muted);font-size:.82rem}

/* lesson */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps i{height:5px;border-radius:9px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.lead{font-size:1.14rem;line-height:1.6;max-width:62ch}
.key{background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-size:1.02rem}
.key b{display:block;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:.84rem;line-height:1.6;padding:14px 16px;border-radius:14px;overflow-x:auto;margin:0;white-space:pre}
.code .k{color:var(--code-kw)} .code .s{color:var(--code-str)} .code .c{color:var(--code-com);font-style:italic}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.02rem;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.opt .l{font-family:var(--mono);font-weight:600;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:14px;padding:14px 16px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block;font-family:var(--display);font-size:1.1rem}

/* reto */
.blank{display:inline-block;min-width:64px;padding:0 6px;border:0;border-bottom:2px dashed var(--code-kw);background:rgba(138,180,255,.14);color:var(--code-str);font-family:var(--mono);font-size:.84rem;border-radius:4px;line-height:1.5;text-align:center}
.blank.ok{border-bottom:2px solid #4CC38A;background:rgba(76,195,138,.2);color:#9BE6C0}
.blank.bad{border-bottom:2px solid #F0776C;background:rgba(240,119,108,.2);color:#FFB3AB}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.piece{font-family:var(--mono);font-weight:600;font-size:.95rem;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);min-height:46px}
.piece:disabled{opacity:.3}

/* walk */
.walk-card{min-height:260px;display:flex;flex-direction:column;gap:14px;justify-content:center;padding:22px 20px}
.walk-kind{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.walk-text{font-size:1.45rem;line-height:1.4;font-family:var(--body);font-weight:700}
.walk-text.small{font-size:1.2rem}
.walk-opts{display:flex;flex-direction:column;gap:6px;font-size:1.1rem}
.walk-opts span{font-family:var(--mono);color:var(--muted);margin-right:8px}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;align-items:center}
.ctl{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ctl svg{width:28px;height:28px}
.ctl.play{height:84px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:24px}
.ctl.play svg{width:38px;height:38px}
select,.seg button{font:inherit}
select{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font-weight:700;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 12px;font-weight:700;min-width:48px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

/* flashcards */
.flash{min-height:250px;border-radius:20px;border:2px solid var(--line);background:var(--surface);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left;width:100%}
.flash.back{border-color:var(--accent);background:var(--accent-soft)}
.flash .q{font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1.25}
.timer{height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--xp)}
.big-score{font-family:var(--display);font-size:3.5rem;font-weight:800;line-height:1}

/* salaries */
.sal{display:grid;gap:14px}
.sal-row{display:grid;gap:5px}
.sal-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sal-top span{font-weight:700;font-size:.95rem}
.sal-top b{font-family:var(--mono);font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sal-bar{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.sal-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.sal-row.base .sal-bar i{background:var(--muted)}
.sal-row small{color:var(--muted);font-size:.78rem}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);padding-top:4px}
.stackgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stackgrid div{background:var(--surface-2);border-radius:12px;padding:12px}
.stackgrid b{display:block;font-family:var(--display)}
.stackgrid small{color:var(--muted)}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plan li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan .wk{font-family:var(--mono);font-size:.82rem;color:var(--accent);font-weight:600;padding-top:2px}
.src{font-size:.85rem;display:grid;gap:6px;padding-left:18px;margin:0}

/* entrevista */
.mode{display:grid;gap:2px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mode b{font-family:var(--display);font-size:1.08rem}
.mode small{color:var(--muted)}
.iv-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iv-q{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.25;text-wrap:balance}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
textarea{width:100%;min-height:150px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}
.pts{display:flex;flex-direction:column;gap:8px}
.pt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 13px}
.pt.on{border-color:var(--good);background:var(--good-soft)}
.pt.on .check{background:var(--good);border-color:var(--good);color:#fff}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.fb-list{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.model{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.countdown{font-family:var(--display);font-size:5rem;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.hist{display:grid}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;font-size:.92rem}
.hist div:last-child{border-bottom:0}
.pill{font-family:var(--mono);font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pill.hi{background:var(--good-soft);color:var(--good)} .pill.mid{background:var(--xp-soft);color:var(--xp)} .pill.lo{background:var(--bad-soft);color:var(--bad)}
.ghost-link{background:none;border:1px dashed var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:grid;gap:2px}
.ghost-link b{font-family:var(--display);font-size:1.08rem}
.ghost-link small{color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><span class="brand-mark">{ }</span>Stack en Marcha</div>
  <span class="chip" id="net" hidden>Sin conexión</span>

  <span class="chip xp" title="Puntos de experiencia"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="xp">0</span></span>
</div></header>

<main class="wrap" id="view"></main>

</div></nav>

 reto:{ code:`___ /api/usuarios     // leer la lista

{ id:'js', n:'JavaScript esencial', d:'El idioma de la web, en frontend y backend', ls:[
  { t:'Variables: const y let', i:'Una variable es una caja con nombre. Usa const cuando el valor no se va a reasignar y let cuando sí. Olvídate de var, es la forma vieja y trae errores raros.',
    c:`const nombre = "Ana";
let puntos = 0;
puntos = puntos + 10;
console.log(\`\${nombre} tiene \${puntos} puntos\`);`,
    k:'Usa const por defecto. Cambia a let solo si el valor va a cambiar.',
    q:['¿Qué usas para un valor que nunca se reasigna?',['let','const','var'],1,'const evita reasignaciones por accidente. Es la opción por defecto en código moderno.'] },
  { t:'Funciones', i:'Una función es una receta: recibe ingredientes (parámetros), hace algo y devuelve un resultado con return. Las arrow functions son la forma corta y las verás en todas partes.',
    c:`function sumar(a, b) {
  return a + b;
}
const doble = (n) => n * 2;
doble(4); // 8`,
    k:'Una función recibe datos, hace algo y devuelve un resultado con return.',
    q:['¿Qué devuelve doble(5)?',['5','10','25'],1,'doble multiplica por 2, entonces 5 por 2 es 10.'] },
  { t:'Arrays: map, filter, find', i:'Casi todo en una app son listas: productos, mensajes, usuarios. Tres métodos resuelven la mayoría de casos. map transforma cada elemento, filter se queda con algunos y find trae el primero que cumpla.',
    c:`const precios = [10, 25, 40];
const conIva = precios.map(p => p * 1.19);
const caros = precios.filter(p => p > 20); // [25, 40]
const primero = precios.find(p => p > 20); // 25`,
    k:'map transforma todo, filter se queda con algunos, find trae el primero.',
    q:['Quieres mostrar solo los productos en oferta. ¿Qué método usas?',['map','filter','push'],1,'filter devuelve un array nuevo solo con los elementos que cumplen la condición.'] },
  { t:'Objetos y el operador ...', i:'Un objeto agrupa datos con nombre, como una ficha. Con las llaves sacas propiedades en una línea. Con los tres puntos copias un objeto y cambias solo lo que necesitas.',
    c:`const user = { nombre: "Ana", edad: 28 };
const { nombre, edad } = user;
const copia = { ...user, edad: 29 };`,
    k:'Las llaves sacan propiedades. Los tres puntos copian sin tocar el original.',
    q:['¿Qué hace { ...user, edad: 29 }?',['Borra user','Crea una copia con la edad cambiada','Da error'],1,'Copia todas las propiedades de user y reemplaza edad. El original queda igual.'] },
  { t:'Async y await', i:'Pedir datos a un servidor o a una base de datos tarda. Con async y await escribes ese código como si fuera en orden, y la app no se congela mientras espera.',
    c:`async function cargarTareas() {
  const res = await fetch("/api/tareas");
  const tareas = await res.json();
  return tareas;
}`,
    k:'await espera una operación lenta, como red o base de datos, sin congelar la app.',
    q:['¿Para qué sirve await?',['Para repetir código','Para esperar una operación asíncrona','Para declarar variables'],1,'await pausa esa función hasta que llega la respuesta, sin bloquear el resto.'] },
 ],
 reto:{ code:`const nums = [1, 2, 3, 4];
const pares = nums.___(n => n % 2 === 0);
const dobles = nums.___(n => n * 2);`, ans:['filter','map'], chips:['map','filter','find','push'] } },

{ id:'ts', n:'TypeScript', d:'JavaScript con tipos: lo que piden las empresas que mejor pagan', ls:[
  { t:'Qué es TypeScript', i:'TypeScript es JavaScript con tipos. Le dices qué clase de dato va en cada lugar y te avisa del error mientras escribes, antes de que llegue al usuario. Hoy es el estándar en empresas serias.',
    c:`let edad: number = 28;
let nombre: string = "Ana";
edad = "treinta"; // Error: no es un number`,
    k:'TypeScript atrapa errores mientras escribes, no cuando el usuario ya los sufrió.',
    q:['¿Cuándo detecta TypeScript los errores de tipo?',['En producción','Mientras escribes o compilas','Nunca'],1,'El editor te marca el error en rojo al instante. Esa es su gran ventaja.'] },
  { t:'Types: la forma de tus datos', i:'Con type describes cómo es un dato: qué propiedades tiene y de qué tipo. Lo defines una vez y lo usas en el frontend y en el backend. Si algo no cuadra, TypeScript te avisa.',
    c:`type Tarea = {
  id: number;
  texto: string;
  hecha: boolean;
};
const t: Tarea = { id: 1, texto: "Estudiar", hecha: false };`,
    k:'Un type describe la forma de tus datos. Defínelo una vez y úsalo en todo el proyecto.',
    q:['Si a t le falta la propiedad hecha, ¿qué pasa?',['Nada','TypeScript marca error','Se llena con null'],1,'El type exige las tres propiedades. Si falta una, el editor lo marca.'] },
  { t:'Funciones tipadas', i:'En las funciones tipas lo que entra y lo que sale. El signo de pregunta marca un parámetro como opcional. Lo que va después de los dos puntos finales es el tipo que devuelve.',
    c:`function saludar(nombre: string, titulo?: string): string {
  return titulo ? \`\${titulo} \${nombre}\` : nombre;
}
saludar("Ana");          // "Ana"
saludar("Ana", "Dra.");  // "Dra. Ana"`,
    k:'El signo ? marca algo como opcional. Lo que va después de ): es lo que devuelve.',
    q:['En titulo?: string, ¿qué significa el ?',['Que es obligatorio','Que es opcional','Que es un número'],1,'Con ? puedes llamar la función sin ese parámetro.'] },
  { t:'Uniones y genéricos', i:'La barra vertical significa "una de estas opciones", perfecto para estados. Los genéricos, con la letra T entre signos, son un tipo comodín que se adapta a lo que le pases.',
    c:`type Estado = "cargando" | "listo" | "error";

function primero<T>(lista: T[]): T | undefined {
  return lista[0];
}`,
    k:'La barra | significa una de estas opciones. <T> es un tipo comodín que se adapta.',
    q:['Con type Estado = "cargando" | "listo", ¿es válido asignar "pausa"?',['Sí','No','Solo en producción'],1,'"pausa" no está en la lista de opciones, así que TypeScript lo rechaza.'] },
 ],
 reto:{ code:`type Producto = {
  nombre: ___;
  precio: ___;
  enStock: ___;
};`, ans:['string','number','boolean'], chips:['boolean','string','number','array'] } },

{ id:'react', n:'React', d:'Interfaces con componentes y estado', ls:[
  { t:'Componentes y props', i:'En React todo es un componente: una función que devuelve interfaz escrita en JSX, que parece HTML. Los datos que le pasas se llaman props, igual que los parámetros de una función.',
    c:`function Saludo({ nombre }: { nombre: string }) {
  return <h1>Hola, {nombre}</h1>;
}

// Uso:
<Saludo nombre="Ana" />`,
    k:'Un componente es una función que devuelve interfaz. Las props son sus parámetros.',
    q:['¿Cómo se llaman los datos que le pasas a un componente?',['props','state','hooks'],0,'Las props entran desde afuera. El state vive adentro del componente.'] },
  { t:'Estado con useState', i:'useState guarda datos que cambian: un contador, un formulario, un menú abierto. Cuando llamas la función que cambia el estado, React vuelve a pintar el componente con el valor nuevo.',
    c:`function Contador() {
  const [n, setN] = useState(0);
  return (
    <button onClick={() => setN(n + 1)}>Clicks: {n}</button>
  );
}`,
    k:'useState guarda datos que cambian. Al llamar setN, React vuelve a pintar.',
    q:['¿Qué pasa al llamar setN(n + 1)?',['Nada visible','El componente se vuelve a pintar con el nuevo valor','Se recarga la página'],1,'React actualiza solo ese pedazo de pantalla, sin recargar la página.'] },
  { t:'Listas con map', i:'Para mostrar una lista recorres el array con map y devuelves un elemento por cada dato. Cada elemento necesita una key única para que React sepa cuál cambió.',
    c:`<ul>
  {tareas.map(t => (
    <li key={t.id}>{t.texto}</li>
  ))}
</ul>`,
    k:'Para pintar listas usa map y dale a cada elemento una key única.',
    q:['¿Qué necesita cada elemento de una lista en React?',['Un color','Una key única','Un id de CSS'],1,'La key, normalmente el id del dato, ayuda a React a actualizar la lista rápido.'] },
  { t:'Cargar datos con useEffect', i:'useEffect ejecuta código después de pintar, por ejemplo pedir datos a tu API. El array vacío al final significa que corre una sola vez, cuando el componente aparece.',
    c:`useEffect(() => {
  fetch("/api/tareas")
    .then(r => r.json())
    .then(setTareas);
}, []); // [] = solo al montar`,
    k:'useEffect ejecuta código después de pintar. Con [] corre una sola vez.',
    q:['¿Qué significa el [] al final de useEffect?',['Corre en cada render','Corre una sola vez al montar','Nunca corre'],1,'Sin dependencias, el efecto corre solo al aparecer el componente.'] },
 ],
 reto:{ code:`const [abierto, ___] = ___(false);

<button onClick={() => setAbierto(!abierto)}>Menú</button>`, ans:['setAbierto','useState'], chips:['useEffect','setAbierto','useState','abierto'] } },

{ id:'next', n:'Next.js', d:'Frontend y backend en un solo proyecto', ls:[
  { t:'Rutas por carpetas', i:'Next.js es el framework full stack más pedido con React. Cada carpeta dentro de app se vuelve una URL. En el mismo proyecto viven tus páginas y tu API.',
    c:`app/
  page.tsx             → /
  tareas/page.tsx      → /tareas
  api/tareas/route.ts  → /api/tareas`,
    k:'En Next.js cada carpeta dentro de app/ es una URL. Frontend y backend viven juntos.',
    q:['¿Qué URL crea app/perfil/page.tsx?',['/app','/perfil','/page'],1,'El nombre de la carpeta es la ruta. page.tsx es lo que se muestra en ella.'] },
  { t:'Server Components', i:'Por defecto, los componentes de Next.js corren en el servidor. Pueden leer la base de datos directo y mandan menos JavaScript al celular. Si necesitas botones con estado, escribes "use client" arriba del archivo.',
    c:`// Corre en el servidor: lee la base de datos directo
export default async function Tareas() {
  const tareas = await db.tarea.findMany();
  return <ul>{tareas.map(t => <li key={t.id}>{t.texto}</li>)}</ul>;
}`,
    k:'Por defecto los componentes corren en el servidor. Usa "use client" solo para interacción.',
    q:['¿Qué escribes arriba de un componente que usa useState?',['"use server"','"use client"','"import react"'],1,'useState necesita el navegador, así que ese componente debe ser de cliente.'] },
  { t:'API Routes', i:'Para crear un endpoint haces un archivo route.ts y exportas una función con el nombre del método HTTP. Así tu frontend y tu app móvil pueden pedir y enviar datos.',
    c:`// app/api/tareas/route.ts
export async function GET() {
  const tareas = await db.tarea.findMany();
  return Response.json(tareas);
}

export async function POST(req: Request) {
  const body = await req.json();
  const nueva = await db.tarea.create({ data: body });
  return Response.json(nueva, { status: 201 });
}`,
    k:'Exporta una función con el nombre del método HTTP y ya tienes un endpoint.',
    q:['Para recibir los datos de una tarea nueva, ¿qué función exportas?',['GET','POST','DELETE'],1,'POST es el método para crear. Lees el body con req.json().'] },
 ],
 reto:{ code:`// app/api/hola/___
export async function ___() {
  return Response.___({ msg: "hola" });
}`, ans:['route.ts','GET','json'], chips:['page.tsx','json','GET','route.ts'] } },

{ id:'node', n:'Node.js y APIs', d:'Servidores, validación y seguridad', ls:[
  { t:'Tu primer servidor', i:'Node.js ejecuta JavaScript en el servidor. Con Express, la librería más usada, creas un endpoint en pocas líneas. express.json() permite leer los datos que envía el cliente.',
    c:`import express from "express";
const app = express();
app.use(express.json());

app.get("/salud", (req, res) => res.json({ ok: true }));

app.listen(3000);`,
    k:'Node ejecuta JavaScript en el servidor. Express crea endpoints en pocas líneas.',
    q:['¿Para qué sirve app.use(express.json())?',['Para leer el body JSON de las peticiones','Para conectarse a la base de datos','Para dibujar HTML'],0,'Sin esa línea, req.body llega vacío cuando el cliente envía JSON.'] },
  { t:'Parámetros en la URL', i:'Una ruta con dos puntos, como /tareas/:id, recibe un valor variable. Lo lees en req.params. Si el dato no existe, respondes 404 con un mensaje claro.',
    c:`app.get("/tareas/:id", async (req, res) => {
  const id = Number(req.params.id);
  const tarea = await db.tarea.findUnique({ where: { id } });
  if (!tarea) return res.status(404).json({ error: "No existe" });
  res.json(tarea);
});`,
    k:'El :id de la ruta llega en req.params. Responde 404 si el dato no existe.',
    q:['En /tareas/:id, ¿dónde lees el id?',['req.body','req.params','req.query'],1,'params es la URL, query es lo que va después del ?, body es lo que envían en POST.'] },
  { t:'Validar con Zod', i:'Nunca confíes en lo que manda el usuario: puede faltar un campo o venir un ataque. Zod revisa que los datos tengan la forma correcta antes de tocar tu base de datos.',
    c:`import { z } from "zod";

const TareaSchema = z.object({
  texto: z.string().min(1),
  hecha: z.boolean().default(false),
});

const datos = TareaSchema.parse(req.body); // lanza error si no cumple`,
    k:'Nunca confíes en lo que manda el usuario. Valida todo lo que entra.',
    q:['¿Por qué validar el body de una petición?',['Por estética','Porque el cliente puede mandar cualquier cosa','Porque Node lo exige'],1,'Cualquiera puede llamar tu API con datos basura. Validar protege tu app.'] },
  { t:'Autenticación segura', i:'Las contraseñas se guardan como hash con bcrypt, nunca en texto. Para saber quién es el usuario usas un token firmado, guardado en una cookie httpOnly. Los secretos van en variables de entorno.',
    c:`// Contraseñas: nunca en texto plano
const hash = await bcrypt.hash(password, 10);
const ok = await bcrypt.compare(intento, hash);

// Sesión: token firmado
const token = jwt.sign(
  { userId: user.id },
  process.env.JWT_SECRET!,
  { expiresIn: "7d" }
);`,
    k:'Guarda solo el hash de la contraseña. Los secretos van en variables de entorno.',
    q:['¿Cómo guardas una contraseña?',['Tal cual','Como hash con bcrypt','En localStorage'],1,'Con un hash, ni tú puedes ver la contraseña. Si te roban la base de datos, siguen protegidas.'] },
 ],
 reto:{ code:`app.___("/productos/:id", (req, res) => {
  const id = req.___.id;
  res.___(404).json({ error: "No existe" });
});`, ans:['get','params','status'], chips:['params','status','get','body'] } },

{ id:'db', n:'Bases de datos', d:'SQL, PostgreSQL y Prisma', ls:[
  { t:'SQL en cuatro verbos', i:'SQL es el idioma de las bases de datos relacionales como PostgreSQL, la más pedida. Con cuatro verbos haces casi todo. WHERE filtra qué filas tocas.',
    c:`SELECT nombre, precio FROM productos WHERE precio > 100 ORDER BY precio DESC;
INSERT INTO productos (nombre, precio) VALUES ('Teclado', 120);
UPDATE productos SET precio = 99 WHERE id = 3;
DELETE FROM productos WHERE id = 3;`,
    k:'SELECT lee, INSERT crea, UPDATE cambia, DELETE borra. Sin WHERE afectas todas las filas.',
    q:['¿Qué hace DELETE FROM productos; sin WHERE?',['Borra una fila','Borra todas las filas','Siempre da error'],1,'Sin WHERE la orden aplica a toda la tabla. Es el error más caro de un junior.'] },
  { t:'Relaciones y JOIN', i:'Las tablas se conectan. Un usuario tiene muchos pedidos, y cada pedido guarda el id de su usuario. Esa columna se llama llave foránea. JOIN une las dos tablas en una consulta.',
    c:`-- Un usuario tiene muchos pedidos
SELECT u.nombre, p.total
FROM usuarios u
JOIN pedidos p ON p.usuario_id = u.id;`,
    k:'Las tablas se conectan con llaves foráneas. JOIN las une en una consulta.',
    q:['pedidos.usuario_id apunta a usuarios.id. ¿Cómo se llama eso?',['Llave foránea','Índice','Vista'],0,'Una llave foránea referencia la llave primaria de otra tabla.'] },
  { t:'Prisma ORM', i:'Un ORM te deja usar la base de datos desde TypeScript, con autocompletado y tipos. Con Prisma describes tus tablas en un archivo y consultas con funciones en vez de escribir SQL a mano.',
    c:`// schema.prisma
model Tarea {
  id    Int     @id @default(autoincrement())
  texto String
  hecha Boolean @default(false)
}

// En tu código
const pendientes = await prisma.tarea.findMany({ where: { hecha: false } });`,
    k:'Un ORM te deja usar la base de datos con TypeScript y tipos, sin SQL a mano.',
    q:['¿Qué te da Prisma?',['Estilos CSS','Consultas a la base de datos con tipos','Hosting'],1,'Prisma genera un cliente tipado a partir de tu esquema.'] },
  { t:'Índices y velocidad', i:'Con pocos datos todo es rápido. Con un millón de filas, buscar sin índice es leer un libro entero para encontrar una palabra. Un índice es el índice del libro.',
    c:`CREATE INDEX idx_pedidos_usuario ON pedidos(usuario_id);
-- Buscar los pedidos de un usuario ahora es mucho más rápido`,
    k:'Un índice acelera las búsquedas en columnas por las que filtras mucho.',
    q:['Tu consulta por email es lenta con un millón de usuarios. ¿Qué agregas?',['Un índice en email','Más CSS','Un useEffect'],0,'Un índice en la columna email convierte una búsqueda lenta en una casi instantánea.'] },
 ],
 reto:{ code:`___ nombre, email ___ usuarios ___ activo = true;`, ans:['SELECT','FROM','WHERE'], chips:['WHERE','INSERT','FROM','SELECT'] } },

{ id:'cloud', n:'Git, Docker y la nube', d:'La habilidad con mayor prima salarial', ls:[
  { t:'Git en equipo', i:'Git guarda la historia de tu código. En equipo trabajas en una rama por cada cambio, haces commits pequeños con mensajes claros y abres un Pull Request para que otro lo revise.',
    c:`git checkout -b feature/login
git add .
git commit -m "Agrega login"
git push origin feature/login
# luego abres un Pull Request en GitHub`,
    k:'Una rama por cambio, commits pequeños y Pull Request para revisar.',
    q:['¿Qué comando guarda un punto en la historia con un mensaje?',['git push','git commit -m','git clone'],1,'commit guarda localmente. push lo sube a GitHub.'] },
  { t:'Docker', i:'Docker empaqueta tu app con todo lo que necesita: versión de Node, librerías y configuración. La misma imagen corre igual en tu computador, en la de tu compañero y en la nube.',
    c:`FROM node:22-alpine
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
CMD ["npm", "start"]`,
    k:'Docker empaqueta tu app. Si corre en tu máquina, corre en la nube.',
    q:['¿Qué problema resuelve Docker?',['"En mi máquina sí funciona"','Diseño de interfaces','Consultas SQL'],0,'El contenedor lleva todo su entorno, así que no depende de la máquina donde corre.'] },
  { t:'La nube: AWS', i:'Saber desplegar y administrar tu app en la nube es la habilidad individual que más sube el salario full stack. Empieza con servicios simples y luego pasa a AWS.',
    c:`Frontend Next.js   → Vercel o AWS Amplify
API / contenedor   → AWS ECS Fargate o Railway
Base de datos      → AWS RDS (PostgreSQL) o Neon
Archivos e imágenes→ AWS S3
Secretos           → variables de entorno`,
    k:'Dominar la nube, y describirla como código, es lo que más sube un salario full stack.',
    q:['¿Dónde guardas en AWS las imágenes que suben los usuarios?',['RDS','S3','Lambda'],1,'S3 es almacenamiento de archivos. RDS es para bases de datos.'] },
  { t:'CI/CD automático', i:'Integración continua significa que cada vez que subes código, un robot corre tus pruebas. Si todo pasa, se despliega solo. Si algo falla, no llega a producción.',
    c:`# .github/workflows/ci.yml
on: [push]

    runs-on: ubuntu-latest

      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test`,
    k:'CI corre tus pruebas en cada push. Si fallan, no se despliega.',
    q:['¿Qué hace CI en cada push?',['Borra ramas','Corre las pruebas automáticamente','Cambia el diseño'],1,'Así detectas errores antes de que los vea un usuario.'] },
 ],
 reto:{ code:`git ___ -b nueva-rama
git ___ .
git ___ -m "Arregla bug"
git ___ origin nueva-rama`, ans:['checkout','add','commit','push'], chips:['push','commit','pull','add','checkout'] } },

{ id:'ia', n:'IA en tus apps', d:'LLMs, RAG y agentes: la prima más alta', tag:'Mejor pagado', ls:[
  { t:'Llamar a un modelo de IA', i:'Una API de inteligencia artificial es solo otro endpoint. Envías mensajes y recibes texto. La clave de la API vive en tu servidor, nunca en el frontend.',
    c:`import Anthropic from "@anthropic-ai/sdk";
const client = new Anthropic(); // lee ANTHROPIC_API_KEY del entorno

const msg = await client.messages.create({
  model: "claude-sonnet-5",
  max_tokens: 1024,
  messages: [{ role: "user", content: "Resume este texto: ..." }],
});`,
    k:'Una API de IA es otro endpoint: envías mensajes, recibes texto. La clave vive en el servidor.',
    q:['¿Dónde debe estar la API key del modelo?',['En el frontend','En el servidor, como variable de entorno','En el HTML'],1,'Si la pones en el frontend, cualquiera la copia y gasta tu dinero.'] },
  { t:'El system prompt', i:'Con el system prompt le das al modelo un rol y reglas: quién es, cómo responde y qué no debe hacer. Instrucciones claras y concretas producen respuestas mejores.',
    c:`const msg = await client.messages.create({
  model: "claude-sonnet-5",
  max_tokens: 500,
  system: "Eres el asistente de soporte de una tienda. Responde corto y amable.",
  messages: [{ role: "user", content: pregunta }],
});`,
    k:'El system prompt define el rol y las reglas. Instrucciones claras dan mejores respuestas.',
    q:['¿Dónde pones las reglas de comportamiento del asistente?',['En system','En max_tokens','En model'],0,'system va aparte de los mensajes y guía todas las respuestas.'] },
  { t:'RAG: la IA con tus datos', i:'El modelo no conoce los documentos de tu empresa. Con RAG primero buscas los fragmentos relevantes en tu base de datos y luego se los envías junto con la pregunta. Así responde con tu información.',
    c:`1. Guardas tus documentos como embeddings (vectores) en pgvector
2. Llega una pregunta: buscas los 5 fragmentos más parecidos
3. Envías pregunta + fragmentos al modelo
4. El modelo responde basado en TUS datos`,
    k:'RAG es buscar primero y generar después. Así la IA responde con datos de tu empresa.',
    q:['¿Qué hace RAG antes de llamar al modelo?',['Busca información relevante','Reinicia el servidor','Traduce el código'],0,'Recupera (retrieval) los fragmentos útiles y con ellos aumenta la pregunta.'] },
  { t:'Tool use y agentes', i:'Puedes darle al modelo herramientas: funciones de tu app con nombre y descripción. El modelo decide cuándo usarlas, tu código las ejecuta y le devuelves el resultado. Así se construyen los agentes.',
    c:`tools: [{
  name: "buscar_pedido",
  description: "Busca un pedido por su número",
  input_schema: {
    type: "object",
    properties: { numero: { type: "string" } },
    required: ["numero"],
  },
}]
// El modelo pide la herramienta, tu código la ejecuta

/* ============ ESTADO ============ */
const KEY = 'stack-en-marcha-v1';
let S = { done:{}, heard:{}, retos:{}, known:{}, xp:0, streak:0, last:null, today:{d:null,xp:0} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const pad = n => String(n).padStart(2,'0');
function dayStr(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addXP(n, msg){
  const t = dayStr();
  if (S.last !== t){ const y = new Date(); y.setDate(y.getDate()-1); S.streak = S.last === dayStr(y) ? S.streak + 1 : 1; S.last = t; }
  if (S.today.d !== t) S.today = { d:t, xp:0 };
  S.today.xp += n; S.xp += n; save(); header(); toast((msg ? msg+' · ' : '') + '+' + n + ' XP');
}
function streakNow(){ const t = dayStr(); const y = new Date(); y.setDate(y.getDate()-1); return (S.last === t || S.last === dayStr(y)) ? S.streak : 0; }
function todayXP(){ return S.today.d === dayStr() ? S.today.xp : 0; }
function levelInfo(){
  let i = 0; for (let k = 0; k < LEVELS.length; k++) if (S.xp >= LEVELS[k][0]) i = k;
  const cur = LEVELS[i], nxt = LEVELS[i+1];
  return { name:cur[1], next: nxt ? nxt[1] : null, pct: nxt ? (S.xp - cur[0]) / (nxt[0] - cur[0]) : 1, need: nxt ? nxt[0] - S.xp : 0 };
}
const lid = (m,l) => MODS[m].id + '-' + l;
function modDone(m){ return MODS[m].ls.filter((_,l) => S.done[lid(m,l)]).length; }
function nextLesson(){ for (let m = 0; m < MODS.length; m++) for (let l = 0; l < MODS[m].ls.length; l++) if (!S.done[lid(m,l)]) return [m,l]; return null; }
const TOTAL = MODS.reduce((a,m) => a + m.ls.length, 0);

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KW = /(\/\/[^\n]*|(?<=^|\s)#[^\n]*|(?<=^|\s)-- [^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|async|await|import|from|export|default|type|if|new|true|false|null|undefined|SELECT|FROM|WHERE|JOIN|ON|INSERT|INTO|VALUES|UPDATE|SET|DELETE|ORDER|BY|DESC|CREATE|INDEX|model|FROM|WORKDIR|COPY|RUN|CMD|git|npx)\b/g;
function hl(code){
  let out = '', last = 0;
  for (const m of code.matchAll(KW)){
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : 'k';
    out += '<span class="'+cls+'">'+esc(m[0])+'</span>';
    last = m.index + m[0].length;

const NATIVE = window.AndroidTTS || null;   // puente de voz de la app Android
const webSpeech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const canSpeak = !!NATIVE || webSpeech;
const ttsCb = {};
window.__ttsDone = id => { const f = ttsCb[id]; delete ttsCb[id]; if (f) f(); };
let VOICE = null;
function pickVoice(){
  if (!webSpeech) return;
  const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  VOICE = vs.find(v => /es[-_](MX|US|CO|419)/i.test(v.lang)) || vs[0] || null;
}
if (webSpeech){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const W = { m:0, q:[], i:0, playing:false, rate:1, think:true, token:0, timer:null, lock:null };
function say(text, cb){
  const tok = ++W.token;
  const done = () => { if (tok === W.token && cb) cb(); };
  if (NATIVE){
    const id = 'u' + tok; ttsCb[id] = done;
    try { if (NATIVE.speak(text, W.rate, id)) return; } catch(e) {}
    delete ttsCb[id];
  }
  if (!webSpeech){ W.timer = setTimeout(done, Math.max(2500, text.length * 65 / W.rate)); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = VOICE ? VOICE.lang : 'es-ES'; if (VOICE) u.voice = VOICE; u.rate = W.rate;
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function hush(){
  W.token++; clearTimeout(W.timer); QOWN = null;
  if (NATIVE) { try { NATIVE.stop(); } catch(e) {} }
  if (webSpeech) speechSynthesis.cancel();
}

/* Cola nativa (app Android): el teléfono reproduce toda la lista de frases y pausas,

const NQ = !!(NATIVE && NATIVE.playQueue);

window.__qProgress = i => { if (QOWN) QOWN.onSeg(i); };
window.__qDone = () => { const o = QOWN; QOWN = null; if (o) o.onDone(); };
window.__qStopped = () => { const o = QOWN; QOWN = null; if (o) o.onStop(); };
function nqPlay(owner, segs, title){
  if (!NQ || !segs.length) return false;
  QOWN = owner;
  try { if (NATIVE.playQueue(JSON.stringify(segs), W.rate, title)) return true; } catch(e) {}
  QOWN = null; return false;
}

function buildQueue(m){
  const q = [];
  MODS[m].ls.forEach((ls,l) => {
    const [qq, opts, ok, ex] = ls.q;
    q.push({ kind:'Lección '+(l+1), show:ls.t, say:'Lección '+(l+1)+'. '+ls.t+'.', l });
    q.push({ kind:'Idea', show:ls.i, say:ls.i, small:true, l });
    q.push({ kind:'Recuerda', show:ls.k, say:'Recuerda: '+ls.k, l });
    q.push({ kind:'Pregunta', show:qq, opts, say:'Pregunta. '+qq+' '+opts.map((o,i)=>'Opción '+'ABC'[i]+': '+o+'.').join(' '), l });
    if (W.think) q.push({ kind:'Piensa', show:'Piensa tu respuesta…', pause:6000, opts, l });
    q.push({ kind:'Respuesta', show:'ABC'[ok]+'. '+opts[ok], sub:ex, say:'La respuesta es '+'ABC'[ok]+': '+opts[ok]+'. '+ex, last:true, l });
  });
  return q;
}
function walkLoad(m){ hush(); W.m = m; W.q = buildQueue(m); W.i = 0; W.playing = false; }
function walkStep(){
  const seg = W.q[W.i];
  paintWalk();
  if (!seg){ const was = W.playing; W.playing = false; paintWalk(); releaseLock(); if (was) addXP(10,'Módulo escuchado'); return; }
  if (!W.playing) return;
  if (NQ && walkNative()) return;
  const nextFn = () => {
    walkSegDone(seg);
    W.i++; walkStep();
  };
  if (seg.pause){ const tok = ++W.token; W.timer = setTimeout(() => { if (tok === W.token) nextFn(); }, seg.pause / W.rate); }
  else say(seg.say, nextFn);
}
function walkSegDone(seg){
  if (seg && seg.last){ const id = lid(W.m, seg.l); if (!S.heard[id]){ S.heard[id] = true; addXP(5,'Lección escuchada'); } }
}
/* Envía al teléfono todo lo que falta del módulo, desde W.i */
function walkNative(){
  const start = W.i;
  const segs = W.q.slice(start).map(s => s.pause ? { pause: Math.round(s.pause / W.rate) } : { say: s.say });
  return nqPlay({
    onSeg: k => { const i = start + k; for (let j = W.i; j < i; j++) walkSegDone(W.q[j]); W.i = i; paintWalk(); },
    onDone: () => { for (let j = W.i; j < W.q.length; j++) walkSegDone(W.q[j]); W.i = W.q.length; walkStep(); },
    onStop: () => { W.playing = false; paintWalk(); },
  }, segs, 'Escuchando: ' + MODS[W.m].n);
}

    <div class="seg" role="group" aria-label="Modo de repaso"><button data-act="rmode" data-v="cards" aria-pressed="${!QZ}">Tarjetas</button><button data-act="rmode" data-v="quiz" aria-pressed="${!!QZ}">Quiz relámpago</button></div>`;
  if (QZ){
    if (QZ.over) return top + `<div class="card stack" style="text-align:center;align-items:center"><span class="big-score">${QZ.score}/5</span>
      <p>${QZ.score >= 4 ? 'Excelente. Vas en serio.' : QZ.score >= 2 ? 'Bien. Repasa las tarjetas de lo que fallaste.' : 'Toca repasar. Escucha el módulo en tu próxima caminata.'}</p></div>
      <button class="btn primary block" data-act="qnew">Otro quiz</button></div>`;
    const it = QZ.items[QZ.i], [q, opts, ok, ex] = it.q, p = QZ.picked;
    return top + `<p class="eyebrow">Pregunta ${QZ.i+1} de 5 · ${esc(MODS[it.m].n)} · 15 segundos</p>
      <div class="timer"><i id="qzt" style="width:${p===null ? Math.max(0,(1-(Date.now()-QZ.t0)/QZ.dur)*100) : 0}%"></i></div>
      <h3 style="font-size:1.35rem">${esc(q)}</h3>
      <div class="opts">${opts.map((o,i)=>{ const cls = p===null ? '' : i===ok ? 'right' : i===p ? 'wrong' : '';
        return `<button class="opt ${cls}" data-act="qans" data-i="${i}" ${p!==null?'disabled':''}><span class="l">${'ABC'[i]}</span><span>${esc(o)}</span></button>`; }).join('')}</div>
      ${p===null ? '' : `<div class="fb ${p===ok?'ok':'no'}"><b>${p===ok?'Correcto':p===-1?'Se acabó el tiempo':'Era la '+'ABC'[ok]}</b>${esc(ex)}</div>
        <button class="btn primary block" data-act="qnext">${QZ.i<4?'Siguiente':'Ver resultado'}</button>`}</div>`;
  }
  const c = F.deck[0];
  return top + `<label for="rf" class="eyebrow">Tema</label>
    <select id="rf" data-act="rfilter"><option value="all" ${F.filter==='all'?'selected':''}>Todo el curso</option>${MODS.map((m,i)=>`<option value="${i}" ${String(i)===String(F.filter)?'selected':''}>${pad(i+1)} · ${esc(m.n)}</option>`).join('')}</select>
    <p class="muted" style="font-size:.9rem">${F.deck.length} tarjetas por repasar · ${Object.keys(S.known).length} dominadas en total</p>
    ${c ? `<button class="flash ${F.flip?'back':''}" data-act="flip" aria-label="Voltear tarjeta">
        <span class="eyebrow">${esc(MODS[c.m].n)} · ${F.flip ? 'Respuesta' : 'Toca para ver la respuesta'}</span>
        ${F.flip ? `<span class="q">${esc(c.q[1][c.q[2]])}</span><span>${esc(c.q[3])}</span>` : `<span class="q">${esc(c.q[0])}</span>`}
      </button>
      ${F.flip ? `<div class="row"><button class="btn" style="flex:1" data-act="again">Otra vez</button><button class="btn primary" style="flex:1" data-act="know">La sé</button></div>` : ''}`
    : `<div class="card"><b>Mazo terminado.</b> <button class="btn block" style="margin-top:12px" data-act="reshuffle">Barajar de nuevo</button></div>`}
  </div>`;
}

  { c:'tec', m:1, q:'¿Qué diferencia hay entre let, const y var?', k:['const no se puede reasignar','let sí se puede reasignar','let y const tienen alcance de bloque','var tiene alcance de función y hoisting, por eso se evita'], a:'const y let tienen alcance de bloque; const no permite reasignar y let sí. var es la forma antigua: tiene alcance de función y se eleva con hoisting, lo que causa errores sutiles. Uso const por defecto y let solo cuando el valor cambia.' },
  { c:'tec', m:1, q:'¿Qué es una Promise y para qué sirve async/await?', k:['Representa un valor que llegará en el futuro','Estados: pendiente, cumplida o rechazada','await espera el resultado sin bloquear la app','Los errores se manejan con try/catch'], a:'Una Promise representa el resultado futuro de una operación asíncrona, como una petición de red. Puede estar pendiente, cumplida o rechazada. async/await permite escribir ese código como si fuera secuencial, sin bloquear el hilo, y manejo los errores con try/catch.' },

  { c:'tec', m:3, q:'¿Para qué sirve useEffect y qué es el array de dependencias?', k:['Ejecuta efectos secundarios, como pedir datos','Corre después de renderizar','Las dependencias deciden cuándo vuelve a correr','Puede devolver una función de limpieza'], a:'useEffect ejecuta efectos secundarios después del render, por ejemplo pedir datos o suscribirse a eventos. El array de dependencias indica cuándo volver a ejecutarlo: vacío, solo al montar; con valores, cuando esos cambian. Puede devolver una función de limpieza para cancelar suscripciones.' },
  { c:'tec', m:4, q:'¿Qué diferencia hay entre renderizar en el servidor y en el cliente?', k:['En el servidor se envía HTML ya listo','Mejor SEO y primera carga más rápida','En el cliente la interfaz se arma con JavaScript en el navegador','Next.js combina ambos según lo que necesite cada componente'], a:'Con renderizado en el servidor el usuario recibe HTML listo, lo que mejora la primera carga y el SEO. En el cliente, el navegador descarga JavaScript y arma la interfaz, algo útil para partes muy interactivas. Next.js combina ambos: componentes de servidor por defecto y "use client" donde hace falta interacción.' },
  { c:'tec', m:5, q:'¿Qué es una API REST? Describe sus métodos.', k:['Recursos identificados por URLs','GET lee, POST crea, PUT o PATCH actualiza, DELETE borra','Responde con códigos de estado HTTP','Sin estado entre peticiones, normalmente con JSON'], a:'Una API REST expone recursos a través de URLs, como /api/tareas. Uso GET para leer, POST para crear, PUT o PATCH para actualizar y DELETE para borrar. Cada respuesta lleva un código de estado, como 200, 201 o 404, y normalmente datos en JSON. Cada petición es independiente y lleva su propia autenticación.' },
  { c:'tec', m:5, q:'¿Cómo protegerías una API?', k:['Autenticación con tokens o cookies httpOnly','Autorización: verificar que el usuario puede hacer esa acción','Validar todas las entradas','HTTPS, límite de peticiones y secretos en variables de entorno'], a:'Primero autenticación, con tokens firmados en cookies httpOnly y contraseñas guardadas con hash. Después autorización: verificar en cada endpoint que ese usuario puede hacer esa acción sobre ese recurso. Valido todas las entradas con Zod, uso HTTPS, limito peticiones por usuario y guardo los secretos en variables de entorno.' },
  { c:'tec', m:6, q:'SQL o NoSQL: ¿cuándo usarías cada una?', k:['SQL: esquema fijo, relaciones y transacciones','NoSQL: documentos flexibles y escala horizontal','La mayoría de apps de negocio encajan en PostgreSQL','Dar un ejemplo concreto de cada caso'], a:'Uso SQL, como PostgreSQL, cuando los datos tienen relaciones claras y necesito transacciones confiables: usuarios, pedidos, pagos. NoSQL encaja con datos muy variables o volúmenes enormes que escalan horizontalmente, como eventos o logs. Para la mayoría de apps de negocio empiezo con PostgreSQL.' },
  { c:'tec', m:6, q:'¿Qué es un índice en una base de datos y cuál es su costo?', k:['Acelera búsquedas y filtros','Funciona como el índice de un libro','Cuesta espacio y hace las escrituras más lentas','Se pone en columnas que filtras o unes mucho'], a:'Un índice es una estructura que permite encontrar filas sin recorrer toda la tabla, como el índice de un libro. Acelera mucho los filtros y los JOIN. Su costo es espacio adicional y escrituras un poco más lentas, así que lo pongo en columnas que consulto mucho, como email o llaves foráneas.' },
  { c:'tec', m:6, q:'¿Qué es el problema N+1?', k:['Una consulta para la lista y otra por cada elemento','Muchas consultas pequeñas que vuelven lenta la app','Se soluciona con JOIN o carga anticipada (include)','Se detecta revisando los logs de consultas'], a:'Ocurre cuando traigo una lista con una consulta y luego hago una consulta extra por cada elemento, por ejemplo el autor de cada post. Con cien posts son ciento una consultas. Lo soluciono con un JOIN o con include en Prisma para traer todo en una o dos consultas, y lo detecto en los logs.' },
  { c:'tec', m:7, q:'¿Qué es Docker y por qué usarlo?', k:['Empaqueta la app con sus dependencias en una imagen','El mismo entorno en desarrollo y producción','Los contenedores son más livianos que una máquina virtual','Facilita desplegar y escalar'], a:'Docker empaqueta mi aplicación con su versión de Node, sus librerías y su configuración en una imagen. Esa imagen corre igual en mi computador y en la nube, lo que elimina el "en mi máquina sí funciona". Los contenedores son más livianos que una máquina virtual y facilitan desplegar y escalar.' },

  { c:'tec', m:8, q:'¿Qué es RAG y cuándo lo usarías?', k:['Buscar documentos relevantes antes de generar la respuesta','Embeddings y búsqueda vectorial, por ejemplo pgvector','Reduce inventos al responder con datos propios','Ejemplo: soporte con la base de conocimiento de la empresa'], a:'RAG significa recuperar y luego generar. Convierto los documentos de la empresa en embeddings, y ante cada pregunta busco los fragmentos más parecidos y se los envío al modelo junto con la pregunta. Así responde con información real y actualizada. Lo usaría en un asistente de soporte o en búsqueda interna.' },
  { c:'tec', m:11, q:'¿Cuándo usarías Python en vez de Node.js en el backend?', k:['Python domina datos, IA y automatización','Tiene librerías como pandas y FastAPI','Node brilla en apps en tiempo real y comparte lenguaje con el frontend','Elegir según el equipo y el problema'], a:'Elegiría Python cuando el backend trabaja mucho con datos, IA o automatización, por sus librerías como pandas, y FastAPI para crear APIs rápidas. Node es ideal si quiero un solo lenguaje con el frontend o apps en tiempo real. La decisión depende del problema y de lo que conozca el equipo.' },
  { c:'tec', m:12, q:'¿Qué son las goroutines en Go y por qué importan?', k:['Funciones que corren de forma concurrente con la palabra go','Son muy livianas: puedes tener miles','Se comunican con channels','Hacen a Go ideal para servidores de alto tráfico'], a:'Una goroutine es una función que corre de forma concurrente, lanzada con la palabra go. Son muy livianas, así que un servidor puede manejar miles al mismo tiempo. Se comunican de forma segura mediante channels. Por eso Go es muy usado en servicios de alto tráfico e infraestructura.' },
  { c:'cod', m:1, q:'¿Cómo invertirías un texto en JavaScript? Explícalo en voz alta.', k:['split convierte el texto en array de caracteres','reverse invierte el array','join lo vuelve a unir en texto','Mencionar casos especiales, como emojis, o un bucle manual'], a:'Usaría texto.split("") para convertirlo en un array de caracteres, luego reverse() para invertirlo y join("") para unirlo otra vez. Si hay emojis uso Array.from(texto) porque respeta caracteres especiales. También podría hacerlo con un bucle que recorra desde el final.' },
  { c:'cod', m:1, q:'Tienes un array de productos con precio y enStock. ¿Cómo calculas el total de los que están en stock?', k:['filter para quedarse con los que tienen enStock en true','reduce para sumar los precios','Valor inicial 0 en reduce','Recorre la lista una vez: complejidad lineal'], a:'Primero filtro con productos.filter(p => p.enStock), luego sumo con reduce((total, p) => total + p.precio, 0), empezando en cero. También se puede hacer en un solo reduce que sume solo si está en stock. En ambos casos recorro la lista en tiempo lineal.' },
  { c:'cod', m:6, q:'Diseña la base de datos de un blog con usuarios, posts y comentarios.', k:['Tres tablas: usuarios, posts y comentarios','Llaves foráneas: post.usuario_id, comentario.post_id y comentario.usuario_id','Índices en las llaves foráneas','Fechas de creación en cada tabla'], a:'Crearía tres tablas. usuarios con id, nombre, email único y hash de contraseña. posts con id, título, contenido, usuario_id y fecha. comentarios con id, texto, post_id, usuario_id y fecha. Pondría índices en las llaves foráneas porque siempre busco los posts de un usuario y los comentarios de un post.' },
  { c:'cod', m:7, q:'Tu app se volvió lenta. ¿Cómo investigas?', k:['Medir primero: métricas, logs y perfilado','Separar si el problema es frontend, API o base de datos','Revisar consultas lentas, índices y N+1','Aplicar caché y paginación donde tenga sentido'], a:'Primero mido en vez de adivinar: reviso métricas y logs para ubicar si la lentitud está en el frontend, en la API o en la base de datos. Si es la base de datos, busco consultas lentas, índices faltantes o problemas N+1. Luego aplico soluciones como índices, paginación o caché, y mido de nuevo para confirmar.' },
  { c:'soft', m:10, q:'Cuéntame un bug difícil que resolviste.', k:['Usar el método STAR: situación, tarea, acción, resultado','Explicar cómo lo diagnosticaste paso a paso','Qué aprendiste','Un resultado concreto o medible'], a:'En TaskFlow IA las tareas a veces aparecían duplicadas. Mi tarea era encontrar la causa. Reproduje el error, revisé los logs y vi que el botón enviaba dos peticiones con doble clic. Deshabilité el botón durante el envío y agregué una restricción única en la base de datos. Los duplicados desaparecieron y aprendí a proteger también el backend.' },

function ivPick(c, n, not){ return shuffle(IVQ.map((q,i) => i).filter(i => IVQ[i].c === c && !(not||[]).includes(i))).slice(0, n); }
function ivBuild(mode){
  const intro = IVQ.findIndex(q => q.q === 'Háblame de ti.');
  if (mode === 'tec') return ivPick('tec', 5);
  if (mode === 'cod') return ivPick('cod', 4);
  if (mode === 'soft') return [intro, ...ivPick('soft', 3, [intro])];

function ivNative(fromReview){
  const segs = [], map = [];
  for (let k = IV.i; k < IV.list.length; k++){
    const it = IVQ[IV.list[k]];
    if (!(fromReview && k === IV.i)){
      segs.push({ say: 'Pregunta ' + (k+1) + '. ' + it.q + ' Tienes ' + IV.wait + ' segundos. Responde en voz alta.' }); map.push({ k, phase:'ask' });
      segs.push({ pause: IV.wait * 1000 }); map.push({ k, phase:'wait' });
    }
    segs.push({ say: ivReviewText(it) }); map.push({ k, phase:'review' });
  }
  return nqPlay({
    onSeg: i => {
      const m = map[i]; if (!m || !IV) return;
      while (IV.i < m.k){ ivRecord(null, 'voz'); IV.i++; }
      IV.phase = m.phase; clearInterval(IV.int);
      if (m.phase === 'wait') ivCountdown();

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch (a){
    case 'tab': if (d.t !== 'caminar' && W.playing){ /* sigue sonando en segundo plano */ } go({ tab:d.t, screen: d.t==='ruta' && V.tab==='ruta' ? 'home' : V.screen }); break;
    case 'home': go({ tab:'ruta', screen:'home' }); break;
    case 'mod': go({ tab:'ruta', screen:'mod', m:+d.m }); break;
    case 'lesson': hush(); go({ tab:'ruta', screen:'lesson', m:+d.m, l:+d.l, step:0, picked:null }); break;
    case 'step': go({ step:+d.s }); break;
    case 'speak': { const ls = MODS[V.m].ls[V.l]; W.playing = false; say(ls.t + '. ' + ls.i + ' Recuerda: ' + ls.k); break; }
    case 'answer': {
      if (V.picked !== null) break;
      const ls = MODS[V.m].ls[V.l], i = +d.i, id = lid(V.m,V.l), ok = i === ls.q[2];
      V.picked = i; render();
      if (!S.done[id]){ S.done[id] = true; addXP(ok ? 10 : 5, ok ? 'Correcto' : 'Lección completa'); }
      break; }
    case 'reto': newReto(+d.m); go({ tab:'ruta', screen:'reto', m:+d.m }); break;
    case 'fill': { const k = R.fill.indexOf(null); if (k < 0) break; R.fill[k] = +d.c; R.used[+d.c] = true; render(); break; }
    case 'unfill': { if (R.checked) break; const i = +d.i, f = R.fill[i]; if (f === null) break; delete R.used[f]; R.fill[i] = null; render(); break; }
    case 'check': {
      R.checked = true; const r = MODS[V.m].reto, win = R.fill.every((f,i) => r.chips[f] === r.ans[i]);
      render(); if (win && !S.retos[MODS[V.m].id]){ S.retos[MODS[V.m].id] = true; addXP(20,'Reto superado'); }
      break; }
    case 'retry': { const r = MODS[V.m].reto; R.fill = R.fill.map((f,i) => f !== null && r.chips[f] === r.ans[i] ? f : null); R.used = {}; R.fill.forEach(f => { if (f !== null) R.used[f] = true; }); R.checked = false; render(); break; }
    case 'walkmod': if (IV && IV.hf){ IV.running = false; clearInterval(IV.int); } walkLoad(+d.m); W.playing = true; grabLock(); go({ tab:'caminar' }); walkStep(); break;
    case 'wplay':
      if (W.playing){ W.playing = false; hush(); releaseLock(); paintWalk(); }
      else { if (IV && IV.hf){ IV.running = false; clearInterval(IV.int); } if (!W.q[W.i]) W.i = 0; W.playing = true; grabLock(); walkStep(); }
      break;
    case 'wnext': hush(); W.i = Math.min(W.q.length, W.i + 1); walkStep(); break;
    case 'wprev': hush(); W.i = Math.max(0, W.i - 1); walkStep(); break;
    case 'rate': W.rate = +d.r; if (W.playing){ hush(); walkStep(); } else paintWalk(); break;
    case 'think': {
      W.think = b.checked; const l = W.q[W.i] ? W.q[W.i].l : 0; hush(); W.q = buildQueue(W.m);
      W.i = Math.max(0, W.q.findIndex(s => s.l === l)); walkStep(); break; }
    case 'rmode': clearInterval(qzInt); if (d.v === 'quiz') newQuiz(); else QZ = null; render(); break;
    case 'flip': F.flip = !F.flip; render(); break;
    case 'again': F.deck.push(F.deck.shift()); F.flip = false; render(); break;
    case 'know': { const c = F.deck.shift(), id = lid(c.m,c.l); F.flip = false; if (!S.known[id]){ S.known[id] = true; addXP(2); } else save(); render(); break; }
    case 'reshuffle': newDeck(F.filter); render(); break;
    case 'qans': { if (QZ.picked !== null) break; const i = +d.i, ok = QZ.items[QZ.i].q[2]; QZ.picked = i; clearInterval(qzInt); if (i === ok){ QZ.score++; addXP(3,'Rápido'); } render(); break; }
    case 'qnext': if (QZ.i < 4){ QZ.i++; QZ.picked = null; QZ.t0 = Date.now(); } else { QZ.over = true; if (QZ.score === 5) addXP(10,'Quiz perfecto'); } render(); break;
    case 'qnew': newQuiz(); render(); break;
    case 'ivhf': S.ivHF = b.checked; save(); break;
    case 'ivwait': S.ivWait = +d.s; save(); render(); break;
    case 'ivstart': ivStart(d.mode); window.scrollTo(0,0); break;
    case 'ivexit': hush(); if (IV) clearInterval(IV.int); if (ivCtl) ivCtl.abort(); IV = null; releaseLock(); render(); break;
    case 'ivsay': W.playing = false; say(ivCur().q); break;
    case 'ivsaymodel': W.playing = false; say(ivCur().a); break;
    case 'iveval': ivEvaluate(); break;
    case 'ivstop': if (ivCtl) ivCtl.abort(); break;
    case 'ivself': hush(); IV.phase = 'review'; render(); break;
    case 'ivcheck': IV.checks[+d.i] = !IV.checks[+d.i]; render(); break;
    case 'ivnext': {
      hush(); const it = ivCur();
      const score = IV.ai ? IV.ai.puntaje : Math.round(it.k.filter((_,i) => IV.checks[i]).length / it.k.length * 10);
      ivRecord(score, IV.ai ? 'ia' : 'auto'); ivNext(); break; }
    case 'ivhfplay':
      if (IV.running){ IV.running = false; hush(); clearInterval(IV.int); releaseLock(); ivPaint(); }
      else { W.playing = false; IV.running = true; grabLock(); ivHF(); }
      break;
    case 'ivskip': hush(); clearInterval(IV.int); ivNext(); break;
    case 'ivdone': if (IV.phase === 'wait') ivHFReview(); break;
  }
});
